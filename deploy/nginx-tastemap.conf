server {
    listen 80 default_server;
    server_name _;

    # Everything proxied to uvicorn for now, including static images —
    # simplest correct setup. If this ever gets real traffic, pointing
    # this block directly at /opt/tastemap/data/images/ for the /img/
    # path would be a cheap win (skips the Python process for static
    # file serving), but isn't needed for a personal-project scale.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
